<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#EBDDA0" />
        <stop offset="100%" stop-color="#FFF8E7" />
      </linearGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4E2717" flood-opacity="0.08"/>
      </filter>
    </defs>
    <rect width="720" height="540" rx="32" fill="url(#bgGrad)" />
    
    <!-- Decorative background blobs -->
    <circle cx="120" cy="100" r="120" fill="#E3B0A0" opacity="0.35" />
    <circle cx="620" cy="440" r="140" fill="#DCE8D4" opacity="0.35" />
    <path d="M 50,420 Q 150,340 280,450 T 500,410" fill="none" stroke="#E3B0A0" stroke-width="4" opacity="0.4" stroke-dasharray="8 8"/>
    
    
      <g transform="translate(360, 260)">
        <!-- Easel -->
        <polygon points="-80,180 -70,180 0,-100 -10,-100" fill="#B8814F" />
        <polygon points="80,180 70,180 0,-100 10,-100" fill="#B8814F" />
        <rect x="-110" y="-40" width="220" height="150" rx="12" fill="#FFFFFF" stroke="#6B3418" stroke-width="6"/>
        <!-- Paint splatters -->
        <circle cx="-40" cy="10" r="30" fill="#E3B0A0"/>
        <circle cx="20" cy="35" r="25" fill="#EBDDA0"/>
        <circle cx="45" cy="-5" r="20" fill="#D9E6EE"/>
        <circle cx="-10" cy="50" r="15" fill="#DCE8D4"/>
        <!-- Child hands -->
        <circle cx="-140" cy="80" r="35" fill="#B8814F"/>
        <circle cx="140" cy="80" r="35" fill="#DCE8D4"/>
      </g>
    

    <!-- Label Card -->
    <g transform="translate(60, 430)" filter="url(#softShadow)">
      <rect width="600" height="70" rx="20" fill="#FFFFFF" opacity="0.95"/>
      <text x="30" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="19" fill="#4E2717">Pottery & Finger Painting</text>
      <text x="30" y="54" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#B8814F">Tactile creative joy</text>
    </g>
  </svg>
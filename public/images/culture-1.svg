<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#DCE8D4" />
        <stop offset="100%" stop-color="#FFF8E7" />
      </linearGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4E2717" flood-opacity="0.08"/>
      </filter>
    </defs>
    <rect width="720" height="540" rx="32" fill="url(#bgGrad)" />
    
    <!-- Decorative background blobs -->
    <circle cx="120" cy="100" r="120" fill="#EBDDA0" opacity="0.35" />
    <circle cx="620" cy="440" r="140" fill="#B8814F" opacity="0.35" />
    <path d="M 50,420 Q 150,340 280,450 T 500,410" fill="none" stroke="#EBDDA0" stroke-width="4" opacity="0.4" stroke-dasharray="8 8"/>
    
    
      <!-- Pink Tower & Blocks -->
      <g transform="translate(360, 260)">
        <rect x="-120" y="100" width="240" height="40" rx="8" fill="#D9E6EE" opacity="0.9"/>
        <rect x="-100" y="60" width="200" height="40" rx="8" fill="#DCE8D4"/>
        <rect x="-80" y="20" width="160" height="40" rx="8" fill="#EBDDA0"/>
        <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#E3B0A0"/>
        <rect x="-40" y="-60" width="80" height="40" rx="8" fill="#B8814F"/>
        <rect x="-20" y="-100" width="40" height="40" rx="8" fill="#6B3418"/>
        <!-- Child silhouettes / spheres -->
        <circle cx="-160" cy="-20" r="45" fill="#B8814F" opacity="0.8"/>
        <circle cx="-160" cy="-80" r="28" fill="#4E2717"/>
        <circle cx="160" cy="10" r="40" fill="#E3B0A0"/>
        <circle cx="160" cy="-45" r="24" fill="#6B3418"/>
      </g>
    

    <!-- Label Card -->
    <g transform="translate(60, 430)" filter="url(#softShadow)">
      <rect width="600" height="70" rx="20" fill="#FFFFFF" opacity="0.95"/>
      <text x="30" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="19" fill="#4E2717">Caring Educators</text>
      <text x="30" y="54" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#B8814F">Nurturing every child with patience and love</text>
    </g>
  </svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="50%" stop-color="#EBDDA0"/>
      <stop offset="100%" stop-color="#D4C077"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3418"/>
      <stop offset="100%" stop-color="#4E2717"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4E2717" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Rounded Cream Background for browser tabs -->
  <rect width="128" height="128" rx="32" fill="#FFF8E7"/>

  <!-- Montessori Wooden Letter Block "A" -->
  <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#blockGrad)" stroke="#B8814F" stroke-width="4" filter="url(#softShadow)"/>
  
  <!-- Subtle inner wooden highlight -->
  <rect x="20" y="20" width="88" height="88" rx="20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Playful Star at top right of the block -->
  <path d="M 94 24 L 96 30 L 102 30 L 97 34 L 99 40 L 94 36 L 89 40 L 91 34 L 86 30 L 92 30 Z" fill="#B8814F"/>

  <!-- Bold, Kid-friendly Letter "A" -->
  <text x="64" y="86" font-family="'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="900" fill="url(#letterGrad)" text-anchor="middle">A</text>
  
  <!-- Small cute Montessori dot under A crossbar -->
  <circle cx="64" cy="98" r="4" fill="#B8814F"/>
</svg>
